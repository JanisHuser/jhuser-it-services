<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story – J.Huser IT-Services</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .story {
      width: 405px;
      height: 720px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

    /* ── Header — compact ── */
    .header {
      background: #6B5CE7;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo-block { display: flex; align-items: center; gap: 8px; }
    .logo-img { width: 26px; height: 26px; object-fit: contain; filter: brightness(0) invert(1); }
    .logo-text { color: white; line-height: 1.15; }
    .logo-text .name { font-size: 13px; font-weight: 800; letter-spacing: -0.01em; }
    .logo-text .sub { font-size: 8px; font-weight: 400; opacity: 0.75; letter-spacing: 0.1em; text-transform: uppercase; }

    .badge {
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 8px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* ── Hero ── */
    .hero {
      padding: 36px 28px 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      flex-shrink: 0;
    }

    .hero-text { flex: 1; }

    .headline {
      font-size: 52px;
      font-weight: 900;
      color: #1a1a2e;
      line-height: 1.0;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .headline span { color: #6B5CE7; }

    .subline {
      font-size: 15px;
      color: #444;
      line-height: 1.6;
      font-weight: 500;
    }

    .photo-wrap {
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #6B5CE7;
    }

    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }

    /* ── Benefits ── */
    .benefits {
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .benefit {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .benefit-check {
      width: 32px;
      height: 32px;
      background: #6B5CE7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      flex-shrink: 0;
    }

    /* ── CTA ── */
    .cta {
      background: #6B5CE7;
      margin-top: auto;
      padding: 28px 28px;
      flex-shrink: 0;
    }

    .cta-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .cta-number {
      font-size: 36px;
      font-weight: 900;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .cta-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div class="story">

    <div class="header">
      <div class="logo-block">
        <img class="logo-img" src="../../../public/logo.png" alt="J.Huser IT-Services Logo" />
        <div class="logo-text">
          <div class="name">J.Huser IT-Services</div>
          <div class="sub">Kanton Glarus</div>
        </div>
      </div>
      <div class="badge">Lokal &amp; persönlich</div>
    </div>

    <div class="hero">
      <div class="hero-text">
        <h1 class="headline">WLAN weg?<br/><span>Ich bin da.</span></h1>
        <p class="subline">Ich löse das Problem<br/>direkt bei Ihnen zu Hause.</p>
      </div>
      <div class="photo-wrap">
        <img src="../../../public/me.png" alt="Janis Huser" />
      </div>
    </div>

    <div class="benefits">
      <div class="benefit">
        <div class="benefit-check">✓</div>
        Vor Ort im Kanton Glarus
      </div>
      <div class="benefit">
        <div class="benefit-check">✓</div>
        Keine versteckten Kosten
      </div>
      <div class="benefit">
        <div class="benefit-check">✓</div>
        Erstberatung kostenlos
      </div>
    </div>

    <div class="cta">
      <div class="cta-label">📞 Jetzt anrufen</div>
      <div class="cta-number">077 524 86 85</div>
      <div class="cta-sub">jhuser-it-services.ch · ab 75 CHF / Std.</div>
    </div>

  </div>
</body>
</html>
